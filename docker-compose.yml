# =============================================================================
# Docker Compose for Simple Voice Chat Standalone Server
# =============================================================================
#
# Usage:
#   docker compose up -d          # Start the server
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop the server
#
# The config file will be auto-generated on first run at:
#   ./voicechat-config/voicechat-standalone.properties
#
# Edit the config and restart:
#   docker compose restart
#
# =============================================================================

services:
  voicechat:
    # ----- Build from source (uncomment to build locally) -----
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    # ----- Use pre-built image from GitHub Container Registry -----
    image: ghcr.io/henkelmax/simple-voice-chat-standalone:latest

    container_name: voicechat-standalone
    restart: unless-stopped

    ports:
      # Voice chat UDP port
      - "24454:24454/udp"
      # TCP control port (same as UDP by default)
      - "24454:24454/tcp"

    volumes:
      # Persistent configuration
      - ./voicechat-config:/app/config

    environment:
      # Override JVM tuning if needed (defaults are baked into the image)
      # JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"

    # Optional: cap memory usage
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
