# Build & publish the standalone server image for Minecraft 1.20.6 (voice chat 2.5.x, compatibility version 18).
# Pushed to the same package as the 1.21.11 image, but only with 1.20.6 tags - never `latest`.
name: Build and Publish Docker Image (1.20.6)

on:
  push:
    tags:
      - 'v1.20.6-*'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-standalone

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standalone JAR
        run: |
          chmod +x gradlew
          ./gradlew --configure-on-demand :common-proxy:shadowJar --no-daemon

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # v1.20.6-2.5.34-standalone.1 -> "1.20.6-2.5.34-standalone.1"
            type=match,pattern=v(.*),group=1
            type=sha,prefix=sha-1.20.6-
            # moving tag for the latest 1.20.6 build
            type=raw,value=1.20.6,enable=${{ github.event_name == 'push' }}
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
