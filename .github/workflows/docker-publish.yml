# =============================================================================
# GitHub Actions: Build & Publish Docker Image to GitHub Container Registry
# =============================================================================
name: Build and Publish Docker Image

on:
  # Trigger on version tags (e.g., v2.6.12, v1.21.11-2.6.12)
  push:
    tags:
      - 'v*'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-standalone

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------
      # Checkout source
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # Build the standalone JAR with Gradle
      # -----------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone JAR
        run: ./gradlew common-proxy:shadowJar --no-daemon

      # -----------------------------------------------------------------
      # Set up QEMU for multi-platform builds (arm64 emulation)
      # -----------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # -----------------------------------------------------------------
      # Set up Docker Buildx for advanced build features
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------
      # Authenticate with GitHub Container Registry
      # -----------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # Extract metadata for tags and labels
      # -----------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Full version from tag: v1.21.11-2.6.12 → "1.21.11-2.6.12"
            type=match,pattern=v(.*),group=1
            # Short SHA: "sha-a1b2c3d"
            type=sha,prefix=sha-
            # latest only on tag pushes
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          flavor: |
            latest=false

      # -----------------------------------------------------------------
      # Build and push multi-platform image
      # -----------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: false
